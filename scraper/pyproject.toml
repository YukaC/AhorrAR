[project]
name = "ahorrar-scraper"
version = "0.1.0"
description = "AhorrAR primary crawler — Scrapling (Python). Node legacy is secondary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scrapling[fetchers]>=0.4.15",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
]

[project.scripts]
ahorrar-scraper = "ahorrar_scraper.server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
