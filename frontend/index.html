<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="description" content="Buscá tu producto, al mejor precio. Comparador de precios en Argentina con envío confirmado." />
    <meta name="color-scheme" content="light dark" />
    <title>AhorrAR — Buscá tu producto, al mejor precio</title>
    <script>
      // Aplica el tema antes del paint para evitar flash blanco/oscuro (FOUC).
      (function () {
        var stored = localStorage.getItem('ahorrar-theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
