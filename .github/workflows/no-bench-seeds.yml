name: Guard — no eval account shims on main

# Eval-only account/saved API helpers live on branch bench/ecc-organic-eval.
# Fail CI if they appear on main (or PRs targeting main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-eval-shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbid eval account/saved shims on main
        run: |
          set -euo pipefail
          bad=0
          if [ -d backend/src/accounts ] || [ -d backend/src/saved ] || [ -d backend/src/bench ]; then
            echo "::error::eval shim directories must not exist on main (accounts/ saved/ bench/)"
            bad=1
          fi
          if grep -RIn --include='*.ts' --include='*.js' \
            -e '/api/bench' -e 'BENCH_SEEDS' -e 'createBenchSeedRouter' \
            -e 'createProfileRouter' -e 'createAccountSearchesRouter' -e 'createSavedRouter' \
            -e 'legacy-compat' \
            backend/src 2>/dev/null; then
            echo "::error::eval seed markers found under backend/src"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no eval shim surface on this ref"
