name: Check

# Mirror of local `npm run check`. Agents can bypass local hooks; CI is authoritative.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: check
        run: npm run check
