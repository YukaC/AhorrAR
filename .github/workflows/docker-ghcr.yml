# MICRO-PLAN Phase A2 — build amd64 API image for OCI E2 Micro (pull on VM, no build on host).
# After push: auto-SSH to Micro → pull :micro + recreate (secrets OCI_MICRO_HOST, OCI_MICRO_SSH_KEY).
# See deploy/oci/MICRO-PLAN.md

name: Docker GHCR

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/docker-entrypoint.sh
      - scripts/oci-micro-pull.sh
      - backend/**
      - scraper/**
      - shared/**
      - deploy/oci/docker-compose.micro.yml
      - .github/workflows/docker-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/yukac/ahorrar-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=micro
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Anonymous pull on Micro (no docker login on the 1 GB VM).
      - name: Set package visibility public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/ahorrar-api/visibility" \
            -f visibility=public \
            || echo "WARN: could not set public visibility (set manually in GHCR package settings)"

  deploy-micro:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull new image on OCI Micro
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_MICRO_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_MICRO_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/ahorrar
            sudo git fetch --depth 1 origin main || true
            sudo git checkout -f origin/main -- \
              scripts/oci-micro-pull.sh \
              deploy/oci/docker-compose.micro.yml \
              deploy/oci/Caddyfile || true
            sudo chmod +x scripts/oci-micro-pull.sh
            sudo AHORRAR_GIT_PULL=0 ./scripts/oci-micro-pull.sh
