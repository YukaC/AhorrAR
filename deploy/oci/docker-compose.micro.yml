# OCI Always Free x86 Micro (VM.Standard.E2.1.Micro, ~1 GB RAM).
# Pre-built image from GHCR — do not build on the Micro host.
# Run from this directory after cloning repo to /opt/ahorrar:
#   cd /opt/ahorrar/deploy/oci && docker compose -f docker-compose.micro.yml pull
# HTTPS (Caddy profile on compose default network; API only on host 127.0.0.1:4000):
#   docker compose -f docker-compose.micro.yml --profile caddy pull && docker compose -f docker-compose.micro.yml --profile caddy up -d

services:
  api:
    image: ghcr.io/yukac/ahorrar-api:micro
    ports:
      - '127.0.0.1:4000:4000'
    env_file:
      - .env
    environment:
      MELI_TOKEN_FILE: /data/meli_tokens.json
      # glibc arena cap — also set in .env; reinforce here for Micro (§V33 ops)
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-2000000}
    volumes:
      - meli_data:/data
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    profiles: ['caddy']
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      API_UPSTREAM: ${API_UPSTREAM:-api:4000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meli_data:
  caddy_data:
  caddy_config:
